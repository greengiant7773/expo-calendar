name: update-events

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pdfplumber
      - run: python build.py --months 2
      - name: commit
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/events.json
          git diff --staged --quiet || git commit -m "update events"
          git push
