<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>展示会カレンダー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 44'%3E%3Crect x='1' y='6' width='38' height='36' rx='7' fill='none' stroke='%2316191d' stroke-width='2.5'/%3E%3Crect x='1' y='6' width='38' height='11' rx='7' fill='%2316191d'/%3E%3Crect x='1' y='11' width='38' height='6' fill='%2316191d'/%3E%3Crect x='9' y='2' width='3' height='8' rx='1.5' fill='%2316191d'/%3E%3Crect x='28' y='2' width='3' height='8' rx='1.5' fill='%2316191d'/%3E%3Crect x='7' y='21' width='7' height='7' rx='1.6' fill='%232a5db0'/%3E%3Crect x='16.5' y='21' width='7' height='7' rx='1.6' fill='%23b8322f'/%3E%3Crect x='26' y='21' width='7' height='7' rx='1.6' fill='%230f7a6c'/%3E%3Crect x='7' y='30.5' width='7' height='7' rx='1.6' fill='%236b4fa8'/%3E%3Crect x='16.5' y='30.5' width='7' height='7' rx='1.6' fill='%23a9711b'/%3E%3Crect x='26' y='30.5' width='7' height='7' rx='1.6' fill='%23e3e5e8'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#16191d;
    --sub:#6b7280;
    --line:#e3e5e8;
    --bg:#fbfbfa;
    --card:#ffffff;
    --bigsight:#2a5db0;
    --makuhari:#b8322f;
    --pacifico:#0f7a6c;
    --forum:#6b4fa8;
    --hamamatsu:#a9711b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.6;
  }
  .wrap{max-width:860px; margin:0 auto; padding:24px 16px 80px}
  header{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:4px}
  h1{font-size:21px; font-weight:700; letter-spacing:.02em; margin:0}
  .logo{display:block; max-width:100%; height:auto}
  .updated{color:var(--sub); font-size:12.5px}

  .controls{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:12px 0 10px; border-bottom:1px solid var(--line); margin-bottom:8px;
  }
  .filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer;
  }
  .chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .chip[aria-pressed="false"]{color:#9aa0a6; background:transparent}
  .chip .dot{width:8px; height:8px; border-radius:50%; background:currentColor}
  .chip[aria-pressed="false"] .dot{opacity:.35}
  .row2{display:flex; gap:8px; flex-wrap:wrap}
  input[type=search]{
    flex:1 1 200px; min-width:0; padding:8px 11px; font-size:14px;
    border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink);
  }
  select{padding:8px 10px; font-size:14px; border:1px solid var(--line); border-radius:8px; background:var(--card)}

  .day{display:grid; grid-template-columns:56px 1fr; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
  .rail{text-align:right; padding-top:2px}
  .dnum{font-size:26px; font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .dwd{font-size:12px; color:var(--sub)}
  .sat .dwd,.sat .dnum{color:#2a5db0}
  .sun .dwd,.sun .dnum{color:#b8322f}
  .monthmark{font-size:11.5px; color:var(--sub); margin-bottom:2px}

  .ev{padding:7px 0; border-top:1px dotted var(--line)}
  .ev:first-child{border-top:0}
  .ev a{color:var(--ink); text-decoration:none; font-weight:600}
  .ev a:hover{text-decoration:underline}
  .meta{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12.5px; color:var(--sub); margin-top:2px}
  .venue{display:inline-flex; align-items:center; gap:5px; font-weight:600}
  .venue .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
  .cont{border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:11.5px}
  .cat{color:var(--sub); font-size:11.5px}

  .notice{background:#fff6e8; border:1px solid #f0d9ae; border-radius:8px; padding:10px 12px; font-size:13px; margin:10px 0}
  .empty{padding:40px 0; color:var(--sub); text-align:center}
  footer{margin-top:28px; font-size:12px; color:var(--sub); line-height:1.8}
  @media (max-width:480px){
    .day{grid-template-columns:44px 1fr; gap:10px}
    .dnum{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg class="logo" width="252" height="44" viewBox="0 0 252 44" role="img" aria-label="展示会カレンダー"><g transform="translate(0,2)"><rect x="1" y="4" width="38" height="36" rx="7" fill="none" stroke="#16191d" stroke-width="2.2"/><rect x="1" y="4" width="38" height="10" rx="7" fill="#16191d"/><rect x="1" y="9" width="38" height="5" fill="#16191d"/><rect x="9" y="0" width="3" height="8" rx="1.5" fill="#16191d"/><rect x="28" y="0" width="3" height="8" rx="1.5" fill="#16191d"/><rect x="7" y="19" width="7" height="7" rx="1.6" fill="#2a5db0"/><rect x="16.5" y="19" width="7" height="7" rx="1.6" fill="#b8322f"/><rect x="26" y="19" width="7" height="7" rx="1.6" fill="#0f7a6c"/><rect x="7" y="28.5" width="7" height="7" rx="1.6" fill="#6b4fa8"/><rect x="16.5" y="28.5" width="7" height="7" rx="1.6" fill="#a9711b"/><rect x="26" y="28.5" width="7" height="7" rx="1.6" fill="#e3e5e8"/></g><text x="52" y="27" font-family="inherit" font-size="22" font-weight="700" letter-spacing="1" fill="#16191d">展示会カレンダー</text><text x="53" y="41" font-family="inherit" font-size="8.5" font-weight="600" letter-spacing="3.2" fill="#6b7280">EXPO CALENDAR</text></svg></h1>
    <span class="updated" id="updated"></span>
  </header>

  <div class="controls">
    <div class="filters" id="filters"></div>
    <div class="row2">
      <input type="search" id="q" placeholder="展示会名で絞り込み">
      <select id="range">
        <option value="1">今日から1ヶ月</option>
        <option value="2">今日から2ヶ月</option>
        <option value="99">取得できた全期間</option>
      </select>
    </div>
  </div>

  <div id="notice"></div>
  <div id="list"><div class="empty">読み込み中</div></div>

  <footer>
    各会場の公式サイトの公開情報をもとに自動収集しています。日程は変更されることがあるため、来場前に主催者の公式サイトで最新情報をご確認ください。
  </footer>
</div>

<script>
const COLORS = {
  "東京ビッグサイト":"var(--bigsight)",
  "幕張メッセ":"var(--makuhari)",
  "パシフィコ横浜":"var(--pacifico)",
  "東京国際フォーラム":"var(--forum)",
  "浜松商工会議所":"var(--hamamatsu)"
};
const WD = ["日","月","火","水","木","金","土"];
let DATA = {events:[], status:[]};
const off = new Set();

fetch("events.json?" + Date.now())
  .then(r => r.json())
  .then(d => { DATA = d; init(); })
  .catch(() => {
    document.getElementById("list").innerHTML =
      '<div class="empty">データを読み込めませんでした。events.json が生成されているか確認してください。</div>';
  });

function init(){
  document.getElementById("updated").textContent = "最終更新 " + (DATA.updated || "");
  const f = document.getElementById("filters");
  Object.keys(COLORS).forEach(v => {
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed","true");
    b.style.color = COLORS[v];
    b.innerHTML = '<span class="dot"></span><span style="color:var(--ink)">' + v + '</span>';
    b.onclick = () => {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", on ? "false" : "true");
      on ? off.add(v) : off.delete(v);
      render();
    };
    f.appendChild(b);
  });
  const warn = (DATA.status || []).filter(s => s.error);
  if (warn.length){
    document.getElementById("notice").innerHTML =
      '<div class="notice">取得に問題があった会場があります: ' +
      warn.map(s => s.venue + "（" + s.error + "）").join("、") + '</div>';
  }
  document.getElementById("q").oninput = render;
  document.getElementById("range").onchange = render;
  render();
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const months = parseInt(document.getElementById("range").value, 10);
  const today = new Date(); today.setHours(0,0,0,0);
  const limit = new Date(today); limit.setMonth(limit.getMonth() + months);

  const byDay = {};
  DATA.events.forEach(e => {
    if (off.has(e.venue)) return;
    if (q && !e.title.toLowerCase().includes(q)) return;
    const s = new Date(e.start + "T00:00:00");
    const en = new Date(e.end + "T00:00:00");
    for (let d = new Date(Math.max(s, today)); d <= en && d < limit; d.setDate(d.getDate()+1)){
      const key = iso(d);
      (byDay[key] = byDay[key] || []).push({...e, first: key === e.start});
    }
  });

  const days = Object.keys(byDay).sort();
  const list = document.getElementById("list");
  if (!days.length){ list.innerHTML = '<div class="empty">該当する展示会はありません</div>'; return; }

  let html = "", lastMonth = "";
  days.forEach(key => {
    const d = new Date(key + "T00:00:00");
    const wd = d.getDay();
    const cls = wd === 0 ? "sun" : wd === 6 ? "sat" : "";
    const mo = d.getMonth() + 1;
    const showMonth = mo !== lastMonth; lastMonth = mo;
    html += '<div class="day ' + cls + '"><div class="rail">' +
      (showMonth ? '<div class="monthmark">' + mo + '月</div>' : '') +
      '<div class="dnum">' + d.getDate() + '</div><div class="dwd">' + WD[wd] + '</div></div><div>';
    byDay[key].sort((a,b) => a.venue.localeCompare(b.venue)).forEach(e => {
      const c = COLORS[e.venue] || "var(--sub)";
      html += '<div class="ev">' +
        (e.url ? '<a href="' + e.url + '" target="_blank" rel="noopener">' + esc(e.title) + '</a>'
               : '<span style="font-weight:600">' + esc(e.title) + '</span>') +
        '<div class="meta"><span class="venue" style="color:' + c + '"><span class="dot"></span>' +
        e.venue + '</span><span>' + fmt(e.start) + (e.end !== e.start ? " 〜 " + fmt(e.end) : "") + '</span>' +
        (e.category ? '<span class="cat">' + esc(e.category) + '</span>' : '') +
        (e.first ? '' : '<span class="cont">会期中</span>') + '</div></div>';
    });
    html += '</div></div>';
  });
  list.innerHTML = html;
}

function iso(d){ const m=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0"); return d.getFullYear()+"-"+m+"-"+dd; }
function fmt(s){ const d = new Date(s + "T00:00:00"); return (d.getMonth()+1) + "/" + d.getDate(); }
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
</script>
</body>
</html>
